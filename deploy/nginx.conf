# Solo si tu VPS ya usa nginx (si no, usa el Caddyfile, que es más simple).
# Después de copiar esto a /etc/nginx/sites-available/robi y activarlo:
#   sudo certbot --nginx -d robi.shona.lat
server {
    listen 80;
    server_name robi.shona.lat;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # eventos en vivo (SSE)
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
