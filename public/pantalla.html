<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ranking en vivo</title>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
  <style>
    :root { --tinta:#15132b; --blanco:#fffdf6; --amarillo:#ffd23f; --rosa:#ff4d8d; --verde:#2ee88a; --azul:#3ad1ff;
      --display:'Lilita One','Arial Black',sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; overflow:hidden; color:var(--blanco); font-family:'Nunito','Segoe UI',sans-serif;
      background: radial-gradient(circle at 15% 15%, rgba(255,77,141,.3), transparent 45%),
                  radial-gradient(circle at 85% 85%, rgba(58,209,255,.25), transparent 45%),
                  linear-gradient(160deg,#1d1a45,#3a1f6b); }
    body { display:grid; grid-template-rows:auto 1fr auto auto; padding:3vh 3vw; gap:2.5vh; }
    .dato { display:flex; align-items:center; gap:2vh; background:rgba(21,19,43,.6); border:.6vh solid var(--tinta);
      border-radius:3vh; padding:1.8vh 3vh; box-shadow:0 1vh 0 var(--tinta); min-height:9vh; }
    .dato .etq { font-family:var(--display); font-size:3.2vh; color:var(--amarillo); white-space:nowrap; }
    .dato .txt { font-size:3.6vh; font-weight:900; }
    .dato .txt.entra { animation:entra-dato .5s ease-out; }
    @keyframes entra-dato { from { opacity:0; transform:translateY(1.5vh); } }
    header { display:flex; align-items:center; justify-content:space-between; }
    h1 { font-family:var(--display); font-weight:normal; font-size:7vh; margin:0; text-shadow:0 .7vh 0 var(--tinta); }
    h1 span { color:var(--rosa); }
    .vivo { font-family:var(--display); font-size:3vh; display:flex; align-items:center; gap:1vh; }
    .vivo::before { content:''; width:2vh; height:2vh; border-radius:50%; background:#ff4d5e; box-shadow:0 0 2vh #ff4d5e; animation:lat 1s infinite; }
    @keyframes lat { 50% { opacity:.3; } }
    main { display:grid; grid-template-columns:1fr 1.15fr; gap:3vw; min-height:0; }
    .caja { background:rgba(21,19,43,.6); border:.6vh solid var(--tinta); border-radius:3vh; padding:2.5vh 3vh; min-height:0; overflow:hidden;
      box-shadow:0 1vh 0 var(--tinta); }
    h2 { font-family:var(--display); font-weight:normal; font-size:4.5vh; margin:0 0 2vh; }
    ol { list-style:none; margin:0; padding:0; }
    .fila { display:flex; align-items:center; gap:2vh; font-size:3.3vh; font-weight:900; padding:.9vh 1.5vh; border-radius:1.5vh; }
    .fila:nth-child(1) { background:rgba(255,210,63,.25); font-size:4vh; }
    .fila.nuevo { animation:brillo 2.5s; }
    @keyframes brillo { 0%,40% { background:var(--verde); color:var(--tinta); } }
    .pos { width:5vh; text-align:center; font-family:var(--display); font-weight:normal; }
    .nombre { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .pts { font-family:var(--display); font-weight:normal; font-size:1.2em; color:var(--amarillo); }
    .barra-f { display:grid; grid-template-columns:5vh 1fr; gap:1.5vh; align-items:center; margin-bottom:1.6vh; }
    .barra-f .ic { font-size:4vh; text-align:center; }
    .barra-f .info { font-size:2.5vh; font-weight:900; display:flex; justify-content:space-between; margin-bottom:.6vh; }
    .riel { height:2.6vh; background:rgba(255,255,255,.12); border-radius:99vh; overflow:hidden; }
    .riel div { height:100%; border-radius:99vh; background:linear-gradient(90deg,var(--rosa),var(--amarillo)); transition:width 1s cubic-bezier(.2,1.2,.4,1); }
    footer { font-size:3vh; font-weight:900; white-space:nowrap; overflow:hidden; }
    .cinta { display:inline-block; animation:cinta 40s linear infinite; padding-left:100%; }
    @keyframes cinta { to { transform:translateX(-100%); } }
    .vacio { opacity:.6; font-size:3vh; font-weight:900; }
    .aviso { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
    .aviso div { font-family:var(--display); font-size:10vh; color:var(--amarillo); -webkit-text-stroke:.8vh var(--tinta); paint-order:stroke fill;
      text-shadow:0 1vh 0 var(--tinta); text-align:center; animation:aviso 4s forwards; }
    @keyframes aviso { 0% { transform:scale(.3); opacity:0; } 10%,80% { transform:scale(1); opacity:1; } 100% { opacity:0; } }
    /* pantalla vertical (TV de pie, tablet o celular) */
    @media (orientation: portrait) {
      body { overflow:auto; height:auto; min-height:100%; }
      header { flex-direction:column; gap:1vh; text-align:center; }
      h1 { font-size:min(7vh, 8vw); }
      main { grid-template-columns:1fr; }
      .fila { font-size:min(3.3vh, 4.5vw); }
      .barra-f .info { font-size:min(2.5vh, 3.6vw); }
      .aviso div { font-size:min(10vh, 11vw); }
      .dato { flex-direction:column; align-items:flex-start; }
      .dato .txt { font-size:min(3.6vh, 4.6vw); }
    }
  </style>
</head>
<body>
  <header>
    <h1>✊✋✌️ ¿Le ganas a <span>Robi</span>?</h1>
    <div class="vivo">EN VIVO · <span id="partidas">0</span> partidas hoy</div>
  </header>
  <main>
    <section class="caja"><h2>🏆 Mejores de hoy</h2><ol id="top"></ol></section>
    <section class="caja"><h2>⚔️ Guerra de formaciones</h2><div id="formaciones"></div></section>
  </main>
  <section class="dato"><span class="etq">🔮 Dato curioso</span><span class="txt" id="dato">Juega contra Robi y aquí aparecerán datos curiosos de tu formación</span></section>
  <footer><span class="cinta" id="cinta">Acércate, muestra tu mano a la cámara y reta a Robi 🤖</span></footer>
  <div class="aviso" id="aviso"></div>
  <script type="module">
    import { Red } from '/js/red.js';
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
    const red = new Red('p');
    const config = await red.get('/api/config');
    const f = (id) => config.formaciones.find((x) => x.id === id) || { icono: '⭐', nombre: id };
    let nuevoId = null;
    let lider = null;

    function pintar(r) {
      document.getElementById('partidas').textContent = r.partidasHoy;
      document.getElementById('top').innerHTML = r.top.length ? r.top.map((p, i) => `
        <li class="fila ${p.id === nuevoId ? 'nuevo' : ''}"><span class="pos">${['🥇','🥈','🥉'][i] || i + 1}</span>
        <span>${f(p.formacion).icono}</span><span class="nombre">${esc(p.nombre)}</span>
        <span class="pts">${p.puntos}</span></li>`).join('') : '<p class="vacio">Esperando al primer valiente…</p>';
      const max = Math.max(1, ...r.formaciones.map((x) => x.puntos));
      document.getElementById('formaciones').innerHTML = r.formaciones.length ? r.formaciones.slice(0, 8).map((x) => `
        <div class="barra-f"><span class="ic">${f(x.id).icono}</span><div>
          <div class="info"><span>${esc(f(x.id).nombre)}</span><span>${x.puntos} pts · ${x.partidas} partidas</span></div>
          <div class="riel"><div style="width:${(100 * x.puntos) / max}%"></div></div></div></div>`).join('')
        : '<p class="vacio">Todavía ninguna formación suma puntos.</p>';
      if (r.recientes.length) {
        document.getElementById('cinta').textContent = r.recientes
          .map((p) => `${f(p.formacion).icono} ${p.nombre} le sacó ${p.puntos} victorias a Robi`).join('   •   ');
      }
      const primero = r.top[0];
      if (primero && lider && primero.id !== lider && primero.id === nuevoId) {
        const a = document.getElementById('aviso');
        a.innerHTML = `<div>¡NUEVO LÍDER!<br>${esc(primero.nombre)} · ${primero.puntos}</div>`;
      }
      lider = primero?.id ?? lider;
    }

    // ---- Datos curiosos: frases armadas con lo que la gente sacó hoy y qué tanto lo predijo Robi
    const NOMBRE_G = { piedra: '✊ piedra', papel: '✋ papel', tijera: '✌️ tijera' };
    const suma = (j) => j.piedra + j.papel + j.tijera;
    const favorita = (j) => Object.keys(NOMBRE_G).reduce((a, g) => (j[g] > j[a] ? g : a), 'piedra');
    const pct = (a, b) => Math.round((100 * a) / b);

    function curiosidades(d) {
      const frases = [];
      if (!d) return frases;
      const total = suma(d.jugadas);
      if (total >= 10) {
        const g = favorita(d.jugadas);
        frases.push(`La jugada más usada hoy es ${NOMBRE_G[g]}: ${pct(d.jugadas[g], total)}% de las veces.`);
      }
      if (d.predicciones >= 10) {
        frases.push(`Hoy Robi adivinó el ${pct(d.aciertos, d.predicciones)}% de las jugadas. Al azar habría adivinado el 33%.`);
      }
      for (const fo of d.formaciones) {
        const t = suma(fo.jugadas);
        if (t < 8) continue;
        const g = favorita(fo.jugadas);
        frases.push(`${f(fo.id).icono} ${esc(f(fo.id).nombre)} saca más ${NOMBRE_G[g]} (${pct(fo.jugadas[g], t)}%).`);
      }
      const medibles = d.formaciones
        .filter((fo) => fo.predicciones >= 6)
        .map((fo) => ({ ...fo, acierto: fo.aciertos / fo.predicciones }))
        .sort((a, b) => b.acierto - a.acierto);
      if (medibles.length >= 2) {
        const mas = medibles[0];
        const menos = medibles.at(-1);
        frases.push(`A ${f(mas.id).icono} ${esc(f(mas.id).nombre)} Robi le lee la mente: adivinó el ${Math.round(100 * mas.acierto)}% de sus jugadas.`);
        frases.push(`${f(menos.id).icono} ${esc(f(menos.id).nombre)} es la más impredecible: Robi solo adivinó el ${Math.round(100 * menos.acierto)}%.`);
      }
      return frases;
    }

    let frases = [];
    let cualFrase = -1; // rotarDato avanza antes de mostrar: así arranca por la primera
    function rotarDato() {
      const el = document.getElementById('dato');
      if (!frases.length) return;
      cualFrase = (cualFrase + 1) % frases.length;
      el.innerHTML = frases[cualFrase];
      el.classList.remove('entra');
      void el.offsetWidth; // reinicia la animación
      el.classList.add('entra');
    }
    setInterval(rotarDato, 7000);

    red.on('nuevo', (p) => { nuevoId = p.id; });
    red.on('ranking', (r) => {
      pintar(r);
      const antes = frases.length;
      frases = curiosidades(r.datos);
      if (!antes && frases.length) rotarDato();
    });
    red.conectar(['hola', 'ranking', 'nuevo']);
  </script>
</body>
</html>
