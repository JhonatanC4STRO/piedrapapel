<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Piedra, Papel o Tijera vs. Robi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/juego.css">
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/three.module.js",
        "three/addons/": "/vendor/three-addons/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <header class="barra">
      <div class="logo"><span>✊✋✌️</span> Piedra, Papel o Tijera</div>
      <div id="marcador" class="marcador"></div>
      <div class="barra-der">
        <button id="btn-pausa" class="mini oculto" title="Pausa (Esc, P o Espacio)">⏸</button>
        <button id="btn-sonido" class="mini" title="Sonido (M)">🔊</button>
        <button id="btn-pantalla" class="mini" title="Pantalla completa (F)">⛶</button>
        <span id="red" class="red" title="Conexión con el servidor"></span>
      </div>
    </header>

    <main class="arena">
      <section class="panel panel-camara">
        <canvas id="cam"></canvas>
        <div class="etiqueta" id="etq-jugador">TÚ</div>
        <div class="etiqueta etiqueta-der oculto" id="etq-jugador2">JUGADOR 2</div>
        <div class="gesto-vivo" id="gesto-vivo"></div>
        <div class="gesto-vivo gesto-vivo-der oculto" id="gesto-vivo2"></div>
      </section>

      <div class="centro">
        <div class="vs">VS</div>
      </div>

      <section class="panel panel-robot">
        <canvas id="robot"></canvas>
        <div class="etiqueta etiqueta-der" id="etq-rival">ROBI</div>
      </section>

      <div id="anuncio" class="anuncio"></div>
    </main>

    <div id="capa" class="capa"></div>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
