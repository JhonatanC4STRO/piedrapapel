<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administración del juego</title>
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; background:#f4f2fb; color:#15132b; margin:0; padding:24px; }
    main { max-width: 860px; margin: 0 auto; }
    h1 { margin-top: 0; }
    .fila { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
    input, button { font: inherit; padding: 8px 12px; border-radius: 8px; border: 2px solid #15132b; }
    button { background:#ffd23f; cursor:pointer; font-weight:700; }
    button.borrar { background:#ff4d5e; color:#fff; padding:4px 10px; }
    table { width:100%; border-collapse: collapse; background:#fff; border-radius:12px; overflow:hidden; }
    th, td { text-align:left; padding:8px 12px; border-bottom:1px solid #e3def2; }
    th { background:#15132b; color:#fff; }
    #msg { font-weight:700; }
  </style>
</head>
<body>
  <main>
    <h1>🛠️ Administración</h1>
    <p>Borra nombres groseros o puntajes sospechosos. La clave aparece en la consola del servidor (o es la variable <code>ADMIN_KEY</code>).</p>
    <div class="fila">
      <input id="clave" type="password" placeholder="Clave de administración">
      <input id="dia" type="date">
      <button id="cargar">Cargar</button>
      <span id="msg"></span>
    </div>
    <table>
      <thead><tr><th>Hora</th><th>Nombre</th><th>Formación</th><th>Puntos</th><th>Racha</th><th></th></tr></thead>
      <tbody id="filas"></tbody>
    </table>
  </main>
  <script>
    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
    try { $('#clave').value = sessionStorage.getItem('clave') || ''; } catch {}

    async function cargar() {
      const clave = $('#clave').value;
      try { sessionStorage.setItem('clave', clave); } catch {}
      const dia = $('#dia').value ? `&dia=${$('#dia').value}` : '';
      const r = await fetch(`/api/admin/puntajes?clave=${encodeURIComponent(clave)}${dia}`);
      const d = await r.json();
      if (!r.ok) { $('#msg').textContent = d.error; return; }
      $('#dia').value = d.dia;
      $('#msg').textContent = `${d.puntajes.length} partidas`;
      $('#filas').innerHTML = d.puntajes.map((p) => `<tr>
        <td>${new Date(p.ts).toLocaleTimeString('es-CO')}</td><td>${esc(p.nombre)}</td><td>${esc(p.formacion)}</td>
        <td>${p.puntos}</td><td>${p.racha}</td>
        <td><button class="borrar" data-id="${esc(p.id)}">Borrar</button></td></tr>`).join('');
    }

    $('#filas').addEventListener('click', async (e) => {
      const id = e.target.dataset?.id;
      if (!id || !confirm('¿Borrar este puntaje del ranking?')) return;
      const r = await fetch('/api/admin/borrar', { method: 'POST', body: JSON.stringify({ clave: $('#clave').value, id }) });
      if (r.ok) cargar(); else $('#msg').textContent = (await r.json()).error;
    });
    $('#cargar').onclick = cargar;
    $('#clave').onkeydown = (e) => { if (e.key === 'Enter') cargar(); };
  </script>
</body>
</html>
